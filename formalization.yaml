# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The total colouring conjecture for graphs of high maximum degree (Yap–Wang–Zhang)"
  description: >-
    A Lean 4 / Mathlib proof that a finite simple graph G has a total colouring with Δ(G) + 2
    colours (a map on V ⊕ E(G) giving different colours to adjacent vertices, to distinct edges
    with a common endpoint, and to incident vertex–edge pairs) in three situations:
    (1) tcc_of_independent: G has an independent set S with |V| ≤ |S| + Δ + 1 (Yap–Wang–Zhang 1989,
    Lemma 2.2; Yap–Chew 1992, Lemma 2.4); (2) tcc_of_card_le_maxDegree_add_three: Δ(G) ≥ |V| − 3
    (Yap–Wang–Zhang 1989, Theorem 2.3 and the closing remarks); (3)
    tcc_of_card_le_maxDegree_add_four: Δ(G) ≥ |V| − 4, for every finite simple graph (no further
    hypothesis; Yap–Wang–Zhang 1989, Theorem 2.4). The proofs use Yap's apex-vertex technique: a
    new vertex joined to the vertices outside one or two independent pairs, matchings found by
    the enlarge-matching argument (when Δ ≥ 7 or G has three pairwise non-adjacent vertices) or,
    when G has no three pairwise non-adjacent vertices, the two alternating matchings of a
    Hamiltonian path through the vertices outside the pairs, and Fournier's theorem
    (PALOMAR-2026-11-08-000009) or Vizing's theorem (PALOMAR-2026-10-15-000004), both imported
    as lake dependencies, in place of the Chetwynd–Hilton theorem on three vertices of maximum
    degree and Kostochka's theorem for Δ ≤ 4 used in the original paper.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15"]

repository:
  role: "substantive-development"

sources:
  - title: "Total chromatic number of graphs of high degree"
    authors:
      - "H. P. Yap"
      - "Wang Jian-Fang"
      - "Zhang Zhongfu"
    id: "doi:10.1017/S1446788700033176"
    type: "paper"
    location: "J. Austral. Math. Soc. (Series A) 47 (1989), 445–452: Lemma 2.2, Theorems 2.3 and 2.4"
    relationship: "formalizes"
    note: >-
      Lemma 2.2 is formalized with the matching supplied by a coverage-maximal matching
      (statement 1); Theorem 2.3 and the closing remarks (Δ ≥ |V| − 3) completely (statement 2);
      Theorem 2.4 (Δ = |V| − 4) completely (statement 3). The formal proof differs from the paper:
      Fournier's theorem replaces the Chetwynd–Hilton theorem on three vertices of maximum degree,
      and the small cases handled in the paper by Kostochka's theorem (Δ ≤ 4) and by the case
      analysis for n = 9, 10 are replaced by a uniform argument for graphs without three pairwise
      non-adjacent vertices (two independent pairs and the alternating matchings of a Hamiltonian
      path, which exists in such graphs by extension and rotation). The formalization is by a
      different author; the article's authors were not involved.
    license: "all rights reserved"
    author_endorsement: "not-contacted"
  - title: "Total chromatic number of graphs of high degree, II"
    authors:
      - "H. P. Yap"
      - "K. H. Chew"
    id: "doi:10.1017/S1446788700035801"
    type: "paper"
    location: "J. Austral. Math. Soc. (Series A) 53 (1992), 219–228: Lemma 2.4"
    relationship: "formalizes"
    note: >-
      Lemma 2.4 (independent set of size at least |V| − Δ − 1) is statement 1. The main result of
      this paper (Δ = |V| − 5) is not formalized; its Lemma 3.4, Case 2 (n = 12) is omitted in the
      paper itself.
    license: "all rights reserved"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "PALOMAR-2026-11-08-000009 (jtraverso/fournier-class-one @ b7baf7b)"
    relationship: "builds-on"
    note: "Pinned dependency: Fournier's theorem FournierLib.fournier."
  - id: "PALOMAR-2026-10-15-000004 (jtraverso/vizing @ 33b2de8)"
    relationship: "builds-on"
    note: "Transitive dependency: Vizing's theorem LeanPool.Vizing.lineGraph_colorable."
  - id: "PALOMAR-2026-11-04-000009 v2 (jtraverso/overfull-critical-graphs @ b85da9a)"
    relationship: "builds-on"
    note: "Transitive dependency of Fournier's theorem (Vizing's adjacency lemma)."

status:
  scope: >-
    Statements 1–3 as described (the total colouring conjecture for Δ(G) ≥ |V| − 4). Not
    formalized: Yap–Chew's main theorem (Δ = |V| − 5).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Wrote the Lean development (TCCHigh/*.lean), the Challenge/Solution pair and the packaging
        under the author's direction, checked with lean against the pinned dependencies,
        #print axioms and a comparison of the elaborated Challenge and Solution statements (pp.all)
        (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e). Statements and
        the construction were tested by brute force in Python on small graphs (scripts/).
      cost:
        wall_time: "about a day"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean development is AI-written under the
    author's direction and mechanically verified: no sorry, axioms limited to propext,
    Classical.choice and Quot.sound, identical elaborated statements in the Challenge and the
    Solution.

fidelity:
  divergences: >-
    Total colourings are maps V ⊕ G.edgeSet → Fin (Δ + 2) (term-only definition
    TCCHigh.IsTotalColoring). The hypothesis Δ(G) ≥ |V| − k is written
    Fintype.card V ≤ G.maxDegree + k. The small cases of Theorem 2.4 are proved by a different
    argument than in the paper (see the source note).

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification. Small cases were
    checked by brute force: every labelled graph with at most 6 vertices and 4Δ ≥ 3|V| has a
    (Δ + 2)-total colouring; all 232 graphs with Δ = |V| − 4 ≤ 6 and no three independent
    vertices (complements of triangle-free graphs of minimum degree 3) have one (these cases are
    now also covered by the formal proof).
    No independent human review has been performed. No mathematical novelty is claimed.

alignment:
  namespace: "TCCHigh"
  statements:
    - {source: "Yap–Wang–Zhang 1989 Lemma 2.2; Yap–Chew 1992 Lemma 2.4", lean: "TCCHigh.tcc_of_independent", module: "TCCHighChallenge", status: "proved"}
    - {source: "Yap–Wang–Zhang 1989 Theorem 2.3 and remarks (Δ ≥ n − 3)", lean: "TCCHigh.tcc_of_card_le_maxDegree_add_three", module: "TCCHighChallenge", status: "proved"}
    - {source: "Yap–Wang–Zhang 1989 Theorem 2.4 (Δ = n − 4)", lean: "TCCHigh.tcc_of_card_le_maxDegree_add_four", module: "TCCHighChallenge", status: "proved"}

