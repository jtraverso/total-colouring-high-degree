name = "tcc_high_degree"
version = "0.1.0"
defaultTargets = ["TCCHigh", "TCCHighChallenge", "TCCHighSolution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "fournier"
git = "https://github.com/jtraverso/fournier-class-one"
rev = "b7baf7b17023d2a2a6dd9650c0706fcabb3bc227"

[[lean_lib]]
name = "TCCHigh"
globs = ["TCCHigh.+"]

[[lean_lib]]
name = "TCCHighChallenge"
roots = ["TCCHighChallenge"]

[[lean_lib]]
name = "TCCHighSolution"
roots = ["TCCHighSolution"]
